<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>To-Do Lista</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Min To-Do Lista!</h1>

    <div class="input-area">
        <input type="text" id="taskInput" placeholder="Skriv en uppgift...">
        <button id="addBtn">Lägg till</button>
    </div>

    <p id="errorMsg" class="error hidden">Du måste skriva något min vän!</p>

    <ul id="taskList"></ul>

    <p id="counter">Klara uppgifter: 0</p>

    <script src="script.js"></script>
</body>
</html>
